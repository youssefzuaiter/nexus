name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Postgres URL (points at the service container below); the rest are
  # dummy values that only need to satisfy lib/config.ts's format validation
  # — the checks job never actually talks to Ollama.
  DATABASE_URL: postgresql://nexus:nexus_ci_password@localhost:5432/nexus
  NEXTAUTH_SECRET: ci-only-secret-never-used-outside-this-workflow-run
  OLLAMA_BASE_URL: http://localhost:11434
  OLLAMA_CHAT_MODEL: llama3.2:3b
  OLLAMA_EMBEDDING_MODEL: nomic-embed-text

jobs:
  # Fast, deterministic checks with no LLM in the loop — this is the tier
  # that should catch almost everything, almost immediately.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      # Build first: it generates Next's ambient PageProps/LayoutProps types
      # into .next/types, which a standalone `tsc` has no other way to see on
      # a fresh checkout — this is the same gotcha CLAUDE.md already notes
      # ("next dev does not catch this — pnpm build does"), just hitting a
      # bare tsc invocation instead of a stale local .next/ directory. Also
      # verifies migrations actually match what Prisma's client expects.
      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Pure-function tests only (chunking, grades, recurrence, ics, spaced
      # repetition, pdf, wiki-links, attachment-store) — nothing here touches
      # Postgres or Ollama, so this tier stays fast and has nothing to flake
      # on.
      - name: Unit tests
        run: pnpm test

      # Cross-tenant isolation for reminders/attachments/conversations/bulk
      # actions/reindex — DB-only, no Ollama, so it stays in this fast job
      # rather than the model-backed ones below.
      - name: Integration tests (DB isolation)
        run: pnpm test:integration

  # The slower, end-to-end tier: a real Postgres, a real Ollama, a real
  # browser driving the actual dev server — the same "trust the browser, not
  # the typecheck" principle this project's own CLAUDE.md holds itself to,
  # now enforced on every push instead of only when someone remembers to
  # run it by hand.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

      - name: Pull the models the app actually uses
        run: |
          ollama pull "$OLLAMA_EMBEDDING_MODEL"
          ollama pull "$OLLAMA_CHAT_MODEL"

      - name: Run the e2e suite against a real server, DB and model
        run: pnpm test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # tests/ai/evals.ts — retrieval precision, multi-tenant isolation under a
  # compromised answer, tool-call validation, and the rest of this project's
  # own dedicated AI-safety benchmark. It needs both models (embedQuery for
  # retrieval, the chat model for answerQuestion/decideAction), so it gets
  # the same Ollama setup as the e2e job rather than reusing checks' Postgres
  # alone. Split into its own job so it can be watched and re-run separately
  # from the (slower, browser-driven) e2e suite — the two don't depend on
  # each other and run in parallel.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

      - name: Pull the models the app actually uses
        run: |
          ollama pull "$OLLAMA_EMBEDDING_MODEL"
          ollama pull "$OLLAMA_CHAT_MODEL"

      - name: Run the AI evaluation suite
        run: pnpm eval
